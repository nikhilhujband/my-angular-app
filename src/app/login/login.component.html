<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">

      <div class="card shadow">
        <div class="card-body">

          <h3 class="text-center mb-4">Login</h3>

          <form (ngSubmit)="login()">

            <!-- Username -->
            <div class="mb-3">
              <label class="form-label">Username</label>

              <input
                type="text"
                class="form-control"
                [(ngModel)]="username"
                name="username"
                placeholder="Enter username">
            </div>

            <!-- Password -->
            <div class="mb-3">
              <label class="form-label">Password</label>

              <input
                type="password"
                class="form-control"
                [(ngModel)]="password"
                name="password"
                placeholder="Enter password">
            </div>

            <!-- Error Message -->
            <div
              *ngIf="errorMessage"
              class="alert alert-danger">
              {{ errorMessage }}
            </div>

            <button
              type="submit"
              class="btn btn-primary w-100">
              Login
            </button>

          </form>

        </div>
      </div>

    </div>
  </div>
</div>
